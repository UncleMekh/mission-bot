name: bot-probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -s -H "Authorization: $MAX_BOT_TOKEN" "https://platform-api2.max.ru/updates?timeout=5"
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
