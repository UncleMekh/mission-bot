name: bot-probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python bot_probe.py
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
